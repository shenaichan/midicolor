<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDI Visualizer!</title>
    <script
      src="https://cdn.socket.io/4.8.1/socket.io.min.js"
      integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.min.js"></script>
  </head>
  <body>
    <script>
      let socket;
      let circles = [];

      function setup() {
        createCanvas(600, 600);
        colorMode(HSB);

        socket = io("http://localhost:8080");

        socket.on("connect", function () {
          console.log("Connected to server");
        });

        socket.on("disconnect", function () {
          console.log("Disconnected from server");
        });

        socket.on("midiEvent", function (data) {
          console.log("Midi data received:", data);

          const hue = map(data.colorIdx, 0, 12, 0, 360);

          console.log(hue);

          circles.push({
            x: width / 2,
            y: height / 2,
            radius: 0,
            hue: hue,
          });
        });
      }

      function draw() {
        // print(circles);
        for (let i = circles.length - 40; i < circles.length; i++) {
          if (i >= 0) {
            let circle = circles[i];

            circle.radius += 3;

            fill(circle.hue, 50, 100);

            ellipse(circle.x, circle.y, circle.radius * 2, circle.radius * 2);
          }
          // if (circle.radius > 500) {
          //   circles.splice(i, 1);
          // }
        }
      }
    </script>
  </body>
</html>
