<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDI Visualizer!</title>
    <script
      src="https://cdn.socket.io/4.8.1/socket.io.min.js"
      integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.min.js"></script>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <script>
      let socket;
      let chords = [];

      function setup() {
        createCanvas(600, 600);
        colorMode(HSB);
        noStroke();
        // textSize(16);
        // textAlign(CENTER, CENTER);

        socket = io("http://localhost:8080");

        socket.on("chordEvent", function (data) {
          const hues = [0, 17, 33, 45, 60, 88, 153, 193, 212, 234, 283, 319];
          const currHues = data.notes.map((note) => hues[note]);
          console.log(currHues);
          chords.push({
            radius: 0,
            hues: currHues,
            name: data.name,
          });
        });
      }

      function draw() {
        // print(arcs);
        for (let i = chords.length - 100; i < chords.length; i++) {
          if (i >= 0) {
            let chord = chords[i];

            chord.radius += 1;

            const len = chord.hues.length;
            const delta = (2 * PI) / len;
            for (let j = 0; j < len; j++) {
              fill(chord.hues[j], 50, 100);
              arc(
                width / 2,
                height / 2,
                chord.radius * 2,
                chord.radius * 2,
                j * delta,
                (j + 1) * delta
              );
            }
            // if (i === chords.length - 1) {
            //   console.log(chord.name);
            //   fill(0, 0, 100);
            //   text(chord.name, width / 2, width / 2);
            // }
          }
        }
      }
    </script>
  </body>
</html>
