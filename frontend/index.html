<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDI Visualizer!</title>
    <script
      src="https://cdn.socket.io/4.8.1/socket.io.min.js"
      integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.min.js"></script>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <script>
      let socket;
      let chords = [];

      function setup() {
        console.log("hello world");

        createCanvas(600, 600);
        colorMode(HSB);
        strokeWeight(2);
        // textSize(16);
        // textAlign(CENTER, CENTER);

        socket = io("http://localhost:8080");

        socket.on("disconnect", function (data) {
          console.log("disconnected");
        });
        socket.on("connect", function (data) {
          console.log("connected");
        });

        socket.on("chordEvent", function (data) {
          console.log("what");
          const hues = [0, 17, 33, 45, 60, 88, 153, 193, 212, 234, 283, 319];

          // console.log(hues);
          const notes = data.notes.map(({ color, velocity }) => ({
            hue: hues[color],
            velocity,
          }));
          console.log({ notes });
          chords.push({
            radius: 0,
            notes,
            name: data.name,
          });
        });
      }

      function draw() {
        // print(arcs);
        // background(0, 0, 255, 0.01);
        for (let i = chords.length - 100; i < chords.length; i++) {
          if (i >= 0) {
            let chord = chords[i];

            chord.radius += deltaTime;

            const len = chord.notes.length;
            const delta = (2 * PI) / len;
            for (let j = 0; j < len; j++) {
              const note = chord.notes[j];

              stroke(
                note.hue,
                50,
                100,
                map(note.velocity * 2, 0, 127, 0, 1, true)
              );
              fill(0, 0, 0, 0);
              arc(
                width / 2,
                height / 2,
                chord.radius * 0.08,
                chord.radius * 0.08,
                j * delta + Math.log10(chord.radius * 0.0015), // map(i - chords.length + 100, 0, 99, 0, 2 * PI),
                (j + 1) * delta + Math.log10(chord.radius * 0.0015) // map(i - chords.length + 100, 0, 99, 0, 2 * PI)
              );
            }
            // if (i === chords.length - 1) {
            //   console.log(chord.name);
            //   fill(0, 0, 100);
            //   text(chord.name, width / 2, width / 2);
            // }
          }
        }
      }
    </script>
  </body>
</html>
